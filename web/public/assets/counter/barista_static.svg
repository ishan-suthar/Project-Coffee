<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="Coffee counter illustration">
  <!-- background -->
  <rect x="0" y="0" width="800" height="260" fill="#f5ede3" />
  <rect x="0" y="0" width="800" height="90" fill="#ead9c4" />
  <rect x="0" y="86" width="800" height="6" fill="#c99b6f" />

  <!-- barista (simple silhouette, left of counter) -->
  <circle cx="110" cy="120" r="20" fill="#8b5e3c" />
  <rect x="88" y="140" width="44" height="60" rx="12" fill="#8b5e3c" />

  <!-- four jars on the shelf, one per real Bean alias -->
  <g transform="translate(220,20)">
    <rect x="0" y="0" width="18" height="8" rx="2" fill="#3e2a1e" />
    <rect x="-4" y="8" width="26" height="40" rx="6" fill="#c99b6f" stroke="#3e2a1e" stroke-width="2" />
  </g>
  <g transform="translate(320,20)">
    <rect x="0" y="0" width="18" height="8" rx="2" fill="#3e2a1e" />
    <rect x="-4" y="8" width="26" height="40" rx="6" fill="#8b5e3c" stroke="#3e2a1e" stroke-width="2" />
  </g>
  <g transform="translate(420,20)">
    <rect x="0" y="0" width="18" height="8" rx="2" fill="#3e2a1e" />
    <rect x="-4" y="8" width="26" height="40" rx="6" fill="#3e2a1e" stroke="#c99b6f" stroke-width="2" />
  </g>
  <g transform="translate(520,20)">
    <rect x="0" y="0" width="18" height="8" rx="2" fill="#3e2a1e" />
    <rect x="-4" y="8" width="26" height="40" rx="6" fill="#d97e30" stroke="#3e2a1e" stroke-width="2" />
  </g>

  <!-- machine silhouette -->
  <rect x="600" y="60" width="90" height="70" rx="6" fill="#3e2a1e" />
  <rect x="630" y="130" width="10" height="18" fill="#3e2a1e" />

  <!-- counter -->
  <rect x="0" y="150" width="800" height="30" fill="#c99b6f" />
  <rect x="0" y="180" width="800" height="80" fill="#ead9c4" />

  <!-- cup on the counter -->
  <rect x="330" y="132" width="34" height="24" rx="4" fill="#3e2a1e" />

  <!-- tips jar, right of counter -->
  <g transform="translate(700,120)">
    <path d="M0 10 L40 10 L36 60 Q36 64 32 64 L8 64 Q4 64 4 60 Z" fill="#f5ede3" stroke="#3e2a1e" stroke-width="2" />
    <rect x="-2" y="4" width="44" height="8" rx="2" fill="#3e2a1e" />
  </g>
</svg>
