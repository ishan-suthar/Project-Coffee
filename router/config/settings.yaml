# Coffee Core Router - runtime settings
#
# Thresholds, defaults, and the escalation cost cap. Safe to hand-edit.

# Escalation cap: if the estimated premium-Bean cost for a re-run is at or
# above this value, escalation pauses and emits escalation_pending instead
# of running automatically. See router/app/escalation.py.
escalation_cost_cap_usd: 0.50

# How long a paused escalation_pending request waits for a human decision
# (POST /v1/approve_escalation) before auto-declining and keeping the
# draft. See router/app/main.py:_await_approval and docs/design/
# escalation-approval-ui-design.md.
escalation_approval_timeout_seconds: 600.0

# SSE keep-alive cadence: a heartbeat event is sent if no real event has
# been queued for this many seconds - long enough to matter mainly during
# an escalation_pending pause, comfortably under typical proxy/browser
# idle-connection timeouts. See router/EVENT_CONTRACT.md v1.3.
sse_heartbeat_interval_seconds: 15.0

# generating SSE tick cadence: emit a tick after this many output tokens OR
# this many seconds, whichever comes first.
generating_tick_tokens: 20
generating_tick_seconds: 2.0

# Outbound OpenRouter request timeout.
request_timeout_seconds: 60

# Optional cheap-model classification fallback (Requirement 3). Off by
# default: the heuristic table in router/app/classifier.py runs first and
# is used unless this is enabled and the heuristic result is low-confidence.
classifier_model_fallback_enabled: false
classifier_model_fallback_bean_alias: "House Blend"

# Failure checks (Requirement 5) that trigger an escalation attempt.
truncation_min_expected_tokens: 32
refusal_keywords:
  - "i cannot help with that"
  - "i can't help with that"
  - "i'm not able to assist"
  - "as an ai language model, i cannot"

# File/image attachments (Brew 38). See router/app/uploads.py and
# docs/design/attachments-design.md.
max_upload_size_bytes: 20971520  # 20 MB
pdf_min_extracted_chars: 20  # below this, treat a PDF as scanned/no-text
max_inline_text_chars: 50000  # cap on extracted text inlined into a prompt
upload_ttl_seconds: 3600  # abandoned router/uploads/<request_id>/ dirs older than this are swept
