<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 800" role="img" aria-hidden="true">
  <rect x="0" y="0" width="260" height="800" fill="#f5ede3" />
  <!-- wall/shelf zone, top of the panel -->
  <rect x="0" y="0" width="260" height="360" fill="#ead9c4" />
  <rect x="0" y="356" width="260" height="6" fill="#c99b6f" />
  <!-- counter zone runs bottom-to-top along the lower portion of the panel
       (previously a thin horizontal band spanning the full width - now a
       tall vertical band spanning the panel's height instead) -->
  <rect x="0" y="600" width="260" height="200" fill="#ead9c4" />
  <rect x="0" y="596" width="260" height="6" fill="#c99b6f" />
</svg>
